<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D6A5B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<meta name="description" content="Catat arus kas harian, rencana tabungan, dan proyeksi investasi sampai pensiun di usia 55.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dompet 55">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Dompet Pensiun 55</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: app shell — sticky header with tab rail, one content column of panels (max 1180px), floating "Catat" button for daily entry */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E9EFED; --ink:#13201C; --muted:#56665F; --line:#D3DDD9;
  --accent:#0D6A5B; --accent-ink:#FFFFFF; --accent-soft:#D4EBE5;
  --good:#1D7537; --good-soft:#DCF0E1; --warn:#9A5B00; --warn-soft:#FBEACF; --bad:#B42318; --bad-soft:#FADFDB;
  --c-eq:#0D6A5B; --c-fi:#3A67AE; --c-cash:#7C8B86; --c-prop:#97487A; --c-gold:#A57E12;
  --c-in:#1D7537; --c-out:#C2492F;
  --font-ui:"Plus Jakarta Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-num:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --surface-2:#1E2925; --ink:#E4EDEA; --muted:#94A49F; --line:#2A3833;
  --accent:#43B9A2; --accent-ink:#04211B; --accent-soft:#173B34;
  --good:#5CC47C; --good-soft:#173322; --warn:#E5A53C; --warn-soft:#3A2A0F; --bad:#F27166; --bad-soft:#3F1B18;
  --c-eq:#43B9A2; --c-fi:#7FA7EA; --c-cash:#8E9F99; --c-prop:#D88BB8; --c-gold:#D9B252;
  --c-in:#5CC47C; --c-out:#F08A70; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --surface-2:#1E2925; --ink:#E4EDEA; --muted:#94A49F; --line:#2A3833;
  --accent:#43B9A2; --accent-ink:#04211B; --accent-soft:#173B34;
  --good:#5CC47C; --good-soft:#173322; --warn:#E5A53C; --warn-soft:#3A2A0F; --bad:#F27166; --bad-soft:#3F1B18;
  --c-eq:#43B9A2; --c-fi:#7FA7EA; --c-cash:#8E9F99; --c-prop:#D88BB8; --c-gold:#D9B252;
  --c-in:#5CC47C; --c-out:#F08A70; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num,.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.02em}
.brand h1{font-size:18px;font-weight:800;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:12px}
.brand .grow{flex:1 1 170px;min-width:0}
@media (max-width:640px){.brand .sub{display:none}.brand h1{font-size:17px}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.g4{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-head .hint{color:var(--muted);font-size:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:4px}
.kpi .lbl{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .val{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi .foot{font-size:12px;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)} .muted{color:var(--muted)} .small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.stack{display:flex;flex-direction:column;gap:8px}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;padding:6px 8px;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:12px 18px;border-radius:999px;font-size:15px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input.in,select.in,textarea.in{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink);width:100%;min-width:0;font-weight:500}
input.in.num{text-align:right}
textarea.in{resize:vertical;min-height:70px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;font-weight:600;color:var(--muted);cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.day td{background:var(--surface-2);font-size:12px;font-weight:700;color:var(--muted);padding:6px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.in{background:var(--good-soft);color:var(--good)}
.chip.out{background:var(--bad-soft);color:var(--bad)}
.chip.tr{background:var(--accent-soft);color:var(--accent)}
.chip.inv{background:color-mix(in srgb,var(--c-fi) 18%,transparent);color:var(--c-fi)}
.chip.ex{background:var(--warn-soft);color:var(--warn)}

.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;position:relative}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn > i{background:var(--warn)} .bar.bad > i{background:var(--bad)} .bar.good > i{background:var(--good)}
.budget-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) auto;gap:12px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.budget-row:last-child{border-bottom:0}
@media (max-width:640px){.budget-row{grid-template-columns:minmax(0,1fr) auto}.budget-row .bwrap{grid-column:1 / -1;order:3}}
.budget-row input.in{width:130px}

.alloc{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.alloc > span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.advice{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px;padding:12px 12px 12px 0;border-bottom:1px solid var(--line)}
.advice:last-child{border-bottom:0}
.advice .stripe{border-radius:4px;background:var(--muted)}
.advice.bad .stripe{background:var(--bad)} .advice.warn .stripe{background:var(--warn)} .advice.good .stripe{background:var(--good)} .advice.info .stripe{background:var(--c-fi)}
.advice h4{margin:0 0 2px;font-size:14px}
.advice p{margin:0;color:var(--muted);font-size:13px}

.banner{border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.banner .grow{flex:1;min-width:200px}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--font-num);font-size:10.5px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;text-align:left}

.bucket{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.bucket .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.bucket ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:13px}

.ai-out{font-size:14px;line-height:1.6;min-height:40px}
.ai-out h4{margin:12px 0 4px;font-size:14.5px}
.ai-out ul{margin:4px 0;padding-left:20px}
.ai-out p{margin:4px 0}

dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,14,12,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 40px)}
.dlg-head{padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dlg-body{padding:4px 18px 8px;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dlg-body .full{grid-column:1 / -1}
@media (max-width:480px){.dlg-body{grid-template-columns:minmax(0,1fr)}}
.dlg-foot{padding:12px 18px 16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;font-size:13px;max-width:calc(100vw - 32px)}
.note{font-size:12px;color:var(--muted)}
.scen th:not(:first-child),.scen td:not(:first-child){text-align:right}
@media (max-width:640px){input.in,select.in,textarea.in{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="mark" aria-hidden="true">55</div>
      <div class="grow">
        <h1>Dompet Pensiun 55</h1>
        <div class="sub">Arus kas harian · rencana tabungan · arah investasi sampai usia pensiun</div>
      </div>
      <span id="status" class="pill"><span class="dot"></span>Memuat…</span>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="ringkasan">Ringkasan</button>
      <button role="tab" data-tab="transaksi">Transaksi</button>
      <button role="tab" data-tab="rencana">Anggaran &amp; Rencana</button>
      <button role="tab" data-tab="aset">Rekening &amp; Aset</button>
      <button role="tab" data-tab="investasi">Investasi &amp; Pensiun</button>
      <button role="tab" data-tab="profil">Profil</button>
    </nav>
  </div>
</header>

<main id="main"><div class="empty">Memuat data keuangan…</div></main>

<button class="btn primary fab" data-action="tx-new" id="fab">＋ Catat</button>
<dialog id="dlg"></dialog>
<div id="toast" hidden></div>

<script>
/* ============ Konstanta ============ */
const TBP_LPS = 3.75;               // % Tingkat Bunga Penjaminan LPS, simpanan Rupiah bank umum
const TBP_PERIOD = '1 Okt 2026 – 31 Jan 2027';
const LPS_MAX = 2e9;                // batas penjaminan per nasabah per bank
const INC_CATS = ['Gaji','Bonus/THR','Lembur/Proyek','Bunga/Dividen','Sewa','Lainnya'];
const EXP_CATS = ['Rumah/Sewa/KPR','Makan & Minum','Belanja Rumah Tangga','Transportasi','Tagihan & Utilitas','Pendidikan','Kesehatan & Asuransi','Cicilan/Utang','Keluarga & Sosial/Zakat','Hiburan & Gaya Hidup','Lainnya'];
const NEEDS = new Set(['Rumah/Sewa/KPR','Makan & Minum','Belanja Rumah Tangga','Transportasi','Tagihan & Utilitas','Pendidikan','Kesehatan & Asuransi','Cicilan/Utang']);
const ACC_PURPOSE = ['Operasional','Dana Darurat','Tabungan Tujuan','Investasi'];
const ACC_TYPES = ['Bank','Bank Digital','E-Wallet','Tunai','RDN/Rekening Investasi'];
const BUCKETS = ['Dana Darurat','Jangka Pendek','Jangka Menengah','Pensiun'];
const ASSET_CLASSES = {
  'Reksa Dana Indeks/ETF':{eq:1}, 'Reksa Dana Saham':{eq:1}, 'Saham':{eq:1},
  'Reksa Dana Campuran':{eq:.5,fi:.5}, 'SBN Ritel (ORI/SR/ST/SBR)':{fi:1}, 'Obligasi/RD Pendapatan Tetap':{fi:1},
  'Deposito':{cash:1}, 'RD Pasar Uang':{cash:1}, 'Emas':{gold:1}, 'Properti':{prop:1}, 'DIRE/REIT':{prop:1},
  'JHT BPJS':{fi:1}, 'DPLK/Dana Pensiun':{eq:.3,fi:.7}, 'Kripto':{eq:1}, 'Lainnya':{fi:1}
};
const LIAB_CLASSES = ['KPR','Kartu Kredit','KTA/Paylater','Cicilan Kendaraan','Lainnya'];
const GROUPS = [['eq','Ekuitas (saham/indeks)','var(--c-eq)'],['fi','Pendapatan tetap (SBN/obligasi)','var(--c-fi)'],['cash','Kas/pasar uang/deposito','var(--c-cash)'],['prop','Properti/DIRE','var(--c-prop)'],['gold','Emas','var(--c-gold)']];
const SCEN = {
  Pesimis:{eq:.05,fi:.045,cash:.025,prop:.03,gold:.03,inf:.05},
  Moderat:{eq:.09,fi:.06,cash:.035,prop:.06,gold:.05,inf:.035},
  Optimis:{eq:.12,fi:.07,cash:.04,prop:.08,gold:.07,inf:.03}
};
const SCEN_COLOR = {Pesimis:'var(--c-out)',Moderat:'var(--c-fi)',Optimis:'var(--c-eq)'};
const MONTHS_ID = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

/* ============ Util ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('id-ID');
const rp = v => (v < 0 ? '−' : '') + 'Rp ' + nf.format(Math.round(Math.abs(v || 0)));
const rpc = v => { const a = Math.abs(v||0), s = v < 0 ? '−' : '';
  if (a >= 1e9) return s + 'Rp ' + (a/1e9).toLocaleString('id-ID',{maximumFractionDigits:2}) + ' M';
  if (a >= 1e6) return s + 'Rp ' + (a/1e6).toLocaleString('id-ID',{maximumFractionDigits:1}) + ' jt';
  if (a >= 1e3) return s + 'Rp ' + Math.round(a/1e3) + ' rb';
  return s + 'Rp ' + Math.round(a); };
const pct = (v, d=0) => (v == null || !isFinite(v)) ? '–' : (v*100).toLocaleString('id-ID',{maximumFractionDigits:d,minimumFractionDigits:d}) + '%';
const num = v => { if (typeof v === 'number') return v; const s = String(v ?? '').replace(/[^\d,-]/g,'').replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const curMonth = () => todayStr().slice(0,7);
const monthLabel = k => { const [y,m] = k.split('-'); return MONTHS_ID[+m-1] + ' ' + y; };
const addMonths = (k, n) => { let [y,m] = k.split('-').map(Number); m += n; while (m > 12){m-=12;y++} while (m < 1){m+=12;y--} return `${y}-${pad(m)}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const sum = (arr, f = x => x) => arr.reduce((a,b) => a + (+f(b) || 0), 0);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=> t.hidden = true, 2600); }
function lsGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch {} }

/* ============ State & penyimpanan (lokal di perangkat) ============ */
const DATA_KEY = 'dp55-data-v1', META_KEY = 'dp55-meta-v1', APP_VERSION = '1.0.1';
const DEFAULT_PROFILE = {retireAge:55, lifeExpectancy:80, emergencyMonths:6, stepUp:5, risk:'Moderat'};
const S = { profile:{...DEFAULT_PROFILE}, budget:{}, accounts:[], assets:[], goals:[], months:{} };
let MODE = 'loading', STORAGE_OK = true, TAB = (location.hash||'').slice(1) || lsGet('dp55-tab') || 'ringkasan';
let META = {};
let txMonth = curMonth(), budMonth = curMonth(), txFilter = {type:'all', q:''};

function applyLocal(path, data){
  const [c, id] = path.split('/');
  if (c === 'settings') S[id] = data || {};
  else if (c === 'months'){ if (data) S.months[id] = data; else delete S.months[id]; }
  else { const arr = S[c]; const i = arr.findIndex(x => x.id === id);
    if (data){ const d = {...data, id}; if (i >= 0) arr[i] = d; else arr.push(d); } else if (i >= 0) arr.splice(i,1); }
}
function snapshot(){ return {app:'dompet-pensiun-55', version:1, savedAt:new Date().toISOString(), profile:S.profile, budget:S.budget, accounts:S.accounts, assets:S.assets, goals:S.goals, months:S.months}; }
function loadInto(d){
  S.profile = d.profile && typeof d.profile === 'object' ? d.profile : {...DEFAULT_PROFILE};
  S.budget = d.budget && typeof d.budget === 'object' ? d.budget : {};
  for (const c of ['accounts','assets','goals']) S[c] = Array.isArray(d[c]) ? d[c].filter(x => x && x.id) : [];
  S.months = d.months && typeof d.months === 'object' ? d.months : {};
}
let saveTimer = null;
function saveNow(){
  clearTimeout(saveTimer); saveTimer = null;
  try { localStorage.setItem(DATA_KEY, JSON.stringify(snapshot())); STORAGE_OK = true; }
  catch (e){ STORAGE_OK = false; toast('Gagal menyimpan di perangkat. Buat backup sekarang.'); }
}
function persist(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 250); }
function saveMeta(){ lsSet(META_KEY, JSON.stringify(META)); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden'){ flushBinds(); if (saveTimer) saveNow(); } });
window.addEventListener('pagehide', () => { flushBinds(); if (saveTimer) saveNow(); });
function put(path, data){
  const clean = data ? JSON.parse(JSON.stringify(data)) : null;
  if (clean) delete clean.id;
  applyLocal(path, clean); persist(); scheduleRender();
  return Promise.resolve();
}

/* ============ Perhitungan ============ */
function allTx(){
  return Object.entries(S.months).flatMap(([k,m]) => (m.items||[]).map(t => ({...t, _m:k})))
    .sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ts||0) - (b.ts||0));
}
function balances(){
  const b = {}; S.accounts.forEach(a => b[a.id] = num(a.opening));
  for (const t of allTx()){
    const v = num(t.amount);
    if (t.type === 'in'){ if (t.acc in b) b[t.acc] += v; }
    else if (t.type === 'out' || t.type === 'inv'){ if (t.acc in b) b[t.acc] -= v; }
    else if (t.type === 'tr'){ if (t.acc in b) b[t.acc] -= v; if (t.to in b) b[t.to] += v; }
  }
  return b;
}
function monthStats(k){
  const items = S.months[k]?.items || [];
  const r = {income:0, expense:0, inv:0, saveTr:0, byCat:{}, needs:0, wants:0, n:items.length};
  const accP = Object.fromEntries(S.accounts.map(a => [a.id, a.purpose]));
  for (const t of items){
    const v = num(t.amount);
    if (t.type === 'in') r.income += v;
    else if (t.type === 'out'){ r.expense += v; r.byCat[t.cat] = (r.byCat[t.cat]||0) + v; if (NEEDS.has(t.cat)) r.needs += v; else r.wants += v; }
    else if (t.type === 'inv') r.inv += v;
    else if (t.type === 'tr' && accP[t.acc] === 'Operasional' && accP[t.to] && accP[t.to] !== 'Operasional') r.saveTr += v;
  }
  r.net = r.income - r.expense;
  r.rate = r.income > 0 ? r.net / r.income : null;
  return r;
}
function monthKeys(){ return Object.keys(S.months).filter(k => (S.months[k].items||[]).length).sort(); }
function avgOf(field, n = 3){
  const cm = curMonth();
  let keys = monthKeys().filter(k => k < cm).slice(-n);
  if (!keys.length) keys = monthKeys().filter(k => k === cm);
  const vals = keys.map(k => monthStats(k)[field]).filter(v => v > 0);
  return vals.length ? sum(vals) / vals.length : 0;
}
function avgExpense(){ return avgOf('expense') || sum(EXP_CATS, c => S.budget.cats?.[c]) || 0; }
function avgIncome(){ return avgOf('income') || num(S.profile.monthlyIncome) || 0; }
function age(){ const by = num(S.profile.birthYear); return by > 1900 ? new Date().getFullYear() - by : null; }
function yearsLeft(){ const a = age(); return a == null ? null : Math.max(0, num(S.profile.retireAge || 55) - a); }
function assetsOnly(){ return S.assets.filter(a => a.kind !== 'liability'); }
function liabs(){ return S.assets.filter(a => a.kind === 'liability'); }
function emergencyFund(b = balances()){
  return sum(S.accounts.filter(a => a.purpose === 'Dana Darurat'), a => b[a.id]) + sum(assetsOnly().filter(a => a.bucket === 'Dana Darurat'), a => a.value);
}
function netWorth(b = balances()){ return sum(S.accounts, a => b[a.id]) + sum(assetsOnly(), a => a.value) - sum(liabs(), a => a.value); }
function groupSplit(list){
  const g = {eq:0, fi:0, cash:0, prop:0, gold:0};
  for (const a of list){ const w = ASSET_CLASSES[a.cls] || {fi:1}; for (const k in w) g[k] += num(a.value) * w[k]; }
  return g;
}
function glide(yl, risk){
  let eq = yl >= 15 ? 70 : yl >= 10 ? 60 : yl >= 5 ? 50 : yl > 0 ? 40 : 25;
  eq += risk === 'Agresif' ? 10 : risk === 'Konservatif' ? -10 : 0;
  const prop = 10, gold = 5, cash = yl >= 5 ? 5 : 10;
  return {eq, fi: 100 - eq - prop - gold - cash, cash, prop, gold};
}
const portRet = (w, sc) => (w.eq*sc.eq + w.fi*sc.fi + w.cash*sc.cash + w.prop*sc.prop + w.gold*sc.gold) / 100;
function project(sc, c0, monthly, years, step, risk){
  let bal = c0, c = monthly; const out = [bal];
  for (let y = 0; y < years; y++){
    const rm = Math.pow(1 + portRet(glide(years - y, risk), sc), 1/12) - 1;
    for (let m = 0; m < 12; m++) bal = bal * (1 + rm) + c;
    c *= 1 + step; out.push(bal);
  }
  return out;
}
function corpusNeeded(sc, years, risk){
  const p = S.profile, T = Math.max(1, num(p.lifeExpectancy || 80) - num(p.retireAge || 55));
  const E = Math.max(0, num(p.retireExpense) - num(p.otherPension)) * 12 * Math.pow(1 + sc.inf, years);
  const r = portRet(glide(0, risk), sc), g = sc.inf;
  if (Math.abs(r - g) < 1e-6) return E * T;
  return E * (1 - Math.pow((1+g)/(1+r), T)) / (r - g) * (1 + r);
}
function retirement(){
  const yl = yearsLeft(); if (yl == null || !(num(S.profile.retireExpense) > 0)) return null;
  const p = S.profile, risk = p.risk || 'Moderat', step = num(p.stepUp ?? 5) / 100;
  const pens = assetsOnly().filter(a => a.bucket === 'Pensiun');
  const c0 = sum(pens, a => a.value), monthly = num(S.budget.plan?.pension);
  const res = {};
  for (const [name, sc] of Object.entries(SCEN)){
    const path = project(sc, c0, monthly, yl, step, risk);
    const need = corpusNeeded(sc, yl, risk);
    let lo = 0, hi = 2e9;
    if (project(sc, c0, 0, yl, step, risk)[yl] >= need) hi = 0;
    else for (let i = 0; i < 60; i++){ const mid = (lo+hi)/2; if (project(sc, c0, mid, yl, step, risk)[yl] >= need) hi = mid; else lo = mid; }
    const fv = path[yl], real = fv / Math.pow(1 + sc.inf, yl);
    const T = Math.max(1, num(p.lifeExpectancy||80) - num(p.retireAge||55));
    res[name] = {path, fv, real, need, gap: fv - need, reqMonthly: hi, ratio: need > 0 ? fv/need : null,
      incomeReal: real * 0.04 / 12 };
  }
  return {yl, c0, monthly, step, risk, res, pens};
}

/* ============ Saran (mesin aturan) ============ */
function advisories(){
  const out = [], b = balances(), p = S.profile;
  const exp = avgExpense(), inc = avgIncome(), cm = curMonth();
  const add = (sev, title, body, tab) => out.push({sev, title, body, tab});
  if (!age() || !(num(p.retireExpense) > 0)) add('warn','Lengkapi profil','Isi tahun lahir, target pengeluaran saat pensiun dan penghasilan bulanan agar proyeksi pensiun bisa dihitung.','profil');
  if (!S.accounts.length) add('info','Tambahkan rekening bank Anda','Masukkan rekening yang sudah Anda punya dan tentukan fungsinya: operasional, dana darurat, tabungan tujuan atau investasi.','aset');

  // Kartu kredit / utang bunga tinggi
  const hi = liabs().filter(l => num(l.rate) >= 12);
  if (hi.length) add('bad','Lunasi utang berbunga tinggi dulu', `${hi.map(l => esc(l.name)+' ('+num(l.rate)+'%/th)').join(', ')} total ${rp(sum(hi,l=>l.value))}. Bunga ini lebih tinggi dari return investasi mana pun yang realistis; pelunasan = "return" pasti.`,'aset');

  // Dana darurat
  const target = num(p.emergencyMonths || 6);
  if (exp > 0){
    const em = emergencyFund(b), m = em / exp;
    if (m < 3) add('bad','Dana darurat kritis', `Baru ${m.toFixed(1)} bulan pengeluaran (${rp(em)}). Target ${target} bulan = ${rp(target*exp)}. Prioritaskan sebelum menambah investasi berisiko.`,'rencana');
    else if (m < target) add('warn','Dana darurat belum penuh', `${m.toFixed(1)} dari ${target} bulan. Kurang ${rp(target*exp - em)}. Simpan di bank digital (bunga ≤ ${TBP_LPS}% agar dijamin LPS) atau RD pasar uang.`,'rencana');
    else if (m > target * 2) add('info','Dana darurat berlebih', `${m.toFixed(1)} bulan pengeluaran. Kelebihan sekitar ${rp(em - target*exp)} bisa dipindah ke SBN ritel atau portofolio pensiun.`,'investasi');
    else add('good','Dana darurat aman', `${m.toFixed(1)} bulan pengeluaran (${rp(em)}).`,'rencana');
  }

  // Rasio menabung
  const st = monthStats(cm), prev = monthStats(addMonths(cm,-1));
  const ref = prev.income > 0 ? prev : st;
  if (ref.income > 0){
    const r = ref.rate, lbl = ref === prev ? monthLabel(addMonths(cm,-1)) : monthLabel(cm);
    if (r < 0) add('bad','Pengeluaran melebihi pemasukan', `${lbl}: defisit ${rp(-ref.net)}. Periksa kategori terbesar di tab Anggaran.`,'rencana');
    else if (r < 0.2) add('warn','Rasio menabung di bawah 20%', `${lbl}: ${pct(r)} dari pemasukan. Target sehat untuk pensiun di 55: minimal 20–30%.`,'rencana');
    else add('good','Rasio menabung sehat', `${lbl}: ${pct(r)} dari pemasukan tersisa untuk tabungan & investasi.`,'ringkasan');
  }

  // Anggaran jebol bulan ini
  const cats = S.budget.cats || {};
  const over = EXP_CATS.filter(c => num(cats[c]) > 0 && (st.byCat[c]||0) > num(cats[c]));
  if (over.length) add('warn','Anggaran terlampaui bulan ini', over.map(c => `${esc(c)} ${rp(st.byCat[c])} / ${rp(cats[c])}`).join(' · '),'rencana');

  // Dana menganggur di rekening operasional
  const opBal = sum(S.accounts.filter(a => a.purpose === 'Operasional'), a => b[a.id]);
  if (exp > 0 && opBal > 1.5 * exp) add('info','Saldo operasional menganggur', `${rp(opBal)} di rekening operasional (≈${(opBal/exp).toFixed(1)}× pengeluaran bulanan). Sisakan 1 bulan, pindahkan ${rp(opBal - exp)} ke dana darurat atau tujuan.`,'rencana');

  // LPS
  for (const a of S.accounts){
    if ((a.type === 'Bank' || a.type === 'Bank Digital') && num(a.rate) > TBP_LPS) add('warn',`Bunga ${esc(a.name)} di atas TBP LPS`, `${num(a.rate)}% > ${TBP_LPS}% (berlaku ${TBP_PERIOD}). Simpanan dengan bunga di atas TBP tidak dijamin LPS.`,'aset');
    if (b[a.id] > LPS_MAX) add('warn',`Saldo ${esc(a.name)} melebihi Rp 2 M`, 'Jaminan LPS maksimal Rp 2 miliar per nasabah per bank. Pecah ke bank lain.','aset');
  }

  // Pensiun
  const R = retirement();
  if (R){
    const m = R.res.Moderat;
    if (R.monthly <= 0) add('warn','Belum ada setoran pensiun bulanan','Isi "Setoran pensiun" di tab Anggaran & Rencana.','rencana');
    else if (m.gap < 0) add('bad','Target pensiun belum tercapai (moderat)', `Proyeksi ${rpc(m.fv)} vs kebutuhan ${rpc(m.need)} di usia ${num(p.retireAge||55)}. Setoran perlu ${rp(m.reqMonthly)}/bln (sekarang ${rp(R.monthly)}), atau turunkan target pengeluaran pensiun.`,'investasi');
    else add('good','Jalur pensiun sesuai target (moderat)', `Proyeksi ${rpc(m.fv)} ≥ kebutuhan ${rpc(m.need)}. Cek juga skenario pesimis.`,'investasi');
    // alokasi
    const tot = R.c0;
    if (tot > 0){
      const g = groupSplit(R.pens), t = glide(R.yl, R.risk);
      const devs = GROUPS.map(([k,l]) => [l, g[k]/tot*100 - t[k]]).filter(d => Math.abs(d[1]) >= 10);
      if (devs.length) add('warn','Alokasi pensiun perlu rebalancing', devs.map(([l,d]) => `${l} ${d>0?'+':''}${d.toFixed(0)} poin dari target`).join(' · '),'investasi');
      const big = R.pens.filter(a => num(a.value)/tot > 0.4 && !/Indeks|ETF/.test(a.cls));
      if (big.length) add('warn','Konsentrasi aset tinggi', big.map(a => `${esc(a.name)} ${pct(num(a.value)/tot)}`).join(', ') + ' dari portofolio pensiun. Sebar ke kelas aset lain.','investasi');
      const kr = sum(R.pens.filter(a => a.cls === 'Kripto'), a => a.value);
      if (kr / tot > 0.05) add('warn','Porsi kripto > 5%', `${pct(kr/tot)} portofolio pensiun ada di aset spekulatif.`,'investasi');
    }
    if (R.yl <= 5) add('info','Masuk fase 5 tahun terakhir', 'Bangun "ember" kas/SBN untuk 3–5 tahun pengeluaran pertama pensiun agar tidak menjual saham saat pasar turun.','investasi');
  }
  const order = {bad:0, warn:1, info:2, good:3};
  return out.sort((a,b) => order[a.sev] - order[b.sev]);
}

/* ============ Grafik SVG ============ */
function niceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function cashflowChart(){
  const cm = curMonth(); const keys = [];
  for (let i = 11; i >= 0; i--) keys.push(addMonths(cm, -i));
  const first = keys.findIndex(k => S.months[k]?.items?.length);
  const ks = first < 0 ? keys.slice(-6) : keys.slice(Math.min(first, 6));
  const data = ks.map(k => ({k, ...monthStats(k)}));
  const W = 640, H = 220, L = 52, R = 8, T = 10, B = 26;
  const max = niceMax(Math.max(1, ...data.map(d => Math.max(d.income, d.expense))));
  const iw = W - L - R, ih = H - T - B, slot = iw / data.length, bw = Math.min(18, slot * 0.32);
  const y = v => T + ih - v / max * ih;
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = max * i / 4, yy = y(v); g += `<line class="grid-l" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${yy+3.5}" text-anchor="end">${esc(rpc(v).replace('Rp ',''))}</text>`; }
  data.forEach((d, i) => {
    const cx = L + slot * i + slot / 2;
    g += `<rect x="${cx - bw - 1}" y="${y(d.income)}" width="${bw}" height="${Math.max(0, ih + T - y(d.income))}" rx="2" fill="var(--c-in)"><title>${monthLabel(d.k)} pemasukan ${rp(d.income)}</title></rect>`;
    g += `<rect x="${cx + 1}" y="${y(d.expense)}" width="${bw}" height="${Math.max(0, ih + T - y(d.expense))}" rx="2" fill="var(--c-out)"><title>${monthLabel(d.k)} pengeluaran ${rp(d.expense)}</title></rect>`;
    g += `<text x="${cx}" y="${H-8}" text-anchor="middle"${d.k === cm ? ' style="fill:var(--ink);font-weight:600"' : ''}>${MONTHS_ID[+d.k.slice(5)-1]}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pemasukan dan pengeluaran per bulan">${g}</svg></div>
  <div class="legend"><span><i style="background:var(--c-in)"></i>Pemasukan</span><span><i style="background:var(--c-out)"></i>Pengeluaran</span></div>`;
}
function retireChart(R){
  const W = 640, H = 240, L = 58, Rr = 12, T = 12, B = 28;
  const a0 = age(), yl = R.yl;
  const need = R.res.Moderat.need;
  const max = niceMax(Math.max(need, ...Object.values(R.res).map(r => r.fv)));
  const iw = W - L - Rr, ih = H - T - B;
  const x = i => L + (yl ? i / yl : 0) * iw, y = v => T + ih - v / max * ih;
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = max*i/4, yy = y(v); g += `<line class="grid-l" x1="${L}" x2="${W-Rr}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${yy+3.5}" text-anchor="end">${esc(rpc(v).replace('Rp ',''))}</text>`; }
  const stepX = yl > 12 ? 5 : yl > 6 ? 2 : 1;
  for (let i = 0; i <= yl; i += stepX) g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${a0 + i}</text>`;
  if (yl % stepX) g += `<text x="${x(yl)}" y="${H-8}" text-anchor="middle">${a0 + yl}</text>`;
  g += `<line x1="${L}" x2="${W-Rr}" y1="${y(need)}" y2="${y(need)}" stroke="var(--ink)" stroke-dasharray="5 4" stroke-width="1.2"/>`;
  g += `<text x="${W-Rr}" y="${y(need)-5}" text-anchor="end" style="fill:var(--ink);font-weight:600">kebutuhan (moderat) ${esc(rpc(need))}</text>`;
  for (const [n, r] of Object.entries(R.res)){
    const pts = r.path.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="${SCEN_COLOR[n]}" stroke-width="${n==='Moderat'?2.6:1.8}" stroke-linejoin="round"/>`;
    g += `<circle cx="${x(yl)}" cy="${y(r.fv)}" r="4" fill="${SCEN_COLOR[n]}" stroke="var(--surface)" stroke-width="1.5"><title>${n}: ${rp(r.fv)}</title></circle>`;
  }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyeksi dana pensiun per usia">${g}</svg></div>
  <div class="legend">${Object.keys(SCEN).map(n => `<span><i style="background:${SCEN_COLOR[n]}"></i>${n}</span>`).join('')}<span>Sumbu X: usia</span></div>`;
}
function allocBar(weights){
  return `<div class="alloc">${GROUPS.map(([k,l,c]) => weights[k] > 0 ? `<span style="width:${weights[k]}%;background:${c}" title="${esc(l)} ${weights[k].toFixed(0)}%"></span>` : '').join('')}</div>`;
}

/* ============ Render ============ */
let renderPending = false, deferUntilBlur = false;
function scheduleRender(){ if (renderPending) return; renderPending = true; requestAnimationFrame(() => { renderPending = false; render(); }); }
document.addEventListener('focusout', () => { if (deferUntilBlur){ deferUntilBlur = false; setTimeout(scheduleRender, 0); } });

function render(){

  st.innerHTML = '<span class="dot"></span>' + (MODE === 'loading' ? 'Memuat…' : STORAGE_OK ? 'Tersimpan di perangkat ini' : 'Gagal menyimpan');

function hasExamples(){

function topBanner(){

const exTag = o => o && o.example ? ' <span class="chip ex">contoh</span>' : '';

function kpi(lbl, val, foot, cls=''){ return `<div class="kpi"><div class="lbl">${lbl}</div><div class="val ${cls}">${val}</div><div class="foot">${foot}</div></div>`; }

function vRingkasan(){
  const b = balances(), cm = curMonth(), st = monthStats(cm), exp = avgExpense();
  const em = emergencyFund(b), emM = exp ? em/exp : null, R = retirement();
  if (!S.accounts.length && !monthKeys().length && !S.assets.length) return onboarding();
  const nw = netWorth(b);
  const retireKpi = R ? kpi('Kesiapan pensiun', pct(Math.min(R.res.Moderat.ratio, 9.99)), `skenario moderat · ${R.yl} th lagi`, R.res.Moderat.ratio >= 1 ? 'pos' : 'neg')
                      : kpi('Kesiapan pensiun','–','isi tahun lahir di Profil');
  let h = `<div class="grid g4">
    ${kpi('Kekayaan bersih', rpc(nw), 'rekening + aset − utang')}
    ${kpi('Arus kas ' + monthLabel(cm), (st.net>=0?'+':'') + rpc(st.net), `masuk ${rpc(st.income)} · keluar ${rpc(st.expense)}`, st.net >= 0 ? 'pos' : 'neg')}
    ${kpi('Dana darurat', emM == null ? rpc(em) : emM.toLocaleString('id-ID',{maximumFractionDigits:1}) + ' bln', `${rpc(em)} · target ${num(S.profile.emergencyMonths||6)} bln`, emM == null ? '' : emM >= num(S.profile.emergencyMonths||6) ? 'pos' : emM < 3 ? 'neg' : '')}

      ${S.accounts.length ? `<div class="tbl-wrap"><table><tbody>${S.accounts.map(a => `<tr><td>${esc(a.name)}${exTag(a)}<div class="small muted">${esc(a.purpose||'')}${a.rate?` · ${num(a.rate)}%/th`:''}</div></td><td class="r num ${b[a.id]<0?'neg':''}">${rp(b[a.id])}</td></tr>`).join('')}

}

function vTransaksi(){

  const st = monthStats(txMonth);

        <input class="in" id="txq" placeholder="Cari kategori/catatan" value="${esc(txFilter.q)}" style="width:190px">

      : `<div class="empty">Belum ada transaksi di ${monthLabel(txMonth)}.<button class="btn primary" data-action="tx-new">＋ Catat transaksi</button></div>`}
  </section>`;
}

function vRencana(){

  const b = balances();
  const accSel = (purpose) => S.accounts.filter(a => a.purpose === purpose);
  const em = emergencyFund(b), exp = avgExpense(), emTarget = num(S.profile.emergencyMonths||6) * exp;

  let h = `<section class="panel"><div class="panel-head"><h2>Rencana alokasi gaji bulanan</h2><span class="hint">“Bayar diri sendiri dulu”: transfer tabungan di hari gajian, belanja dari sisanya</span></div>
  <div class="grid g4">

    <div class="stack"><div class="spread"><span>Keinginan</span><b class="num">${pct(inc?wantB/inc:null)}</b></div><div class="small muted">Acuan ≤ 30%</div></div>
    <div class="stack"><div class="spread"><span>Tabungan + investasi</span><b class="num ${inc && saveP/inc >= .2 ? 'pos':'neg'}">${pct(inc?saveP/inc:null)}</b></div><div class="small muted">Acuan ≥ 20%; untuk pensiun di 55 idealnya 25–35%</div></div>

  <h3>Checklist hari gajian</h3>
  <div class="tbl-wrap"><table><tbody>
    ${checkRow('Dana darurat', plan.emergency, accSel('Dana Darurat'), em >= emTarget && emTarget > 0 ? 'Sudah penuh: alihkan setoran ini ke pensiun.' : emTarget ? `Terkumpul ${rpc(em)} dari ${rpc(emTarget)}` : '')}
    ${checkRow('Tabungan tujuan', plan.goals, accSel('Tabungan Tujuan'), S.goals.length ? `${S.goals.length} tujuan aktif` : 'Tambah tujuan di bawah')}
    ${checkRow('Investasi pensiun', plan.pension, accSel('Investasi'), 'Beli rutin (auto-debit) RD indeks / SBN sesuai alokasi di tab Investasi')}
  </tbody></table></div>
  </section>`;

  // Anggaran per kategori
  h += `<section class="panel"><div class="panel-head">${monthNav(budMonth,'bud-month')}
      <div class="row"><span class="hint">Anggaran ${rp(totB)} · terpakai ${rp(st.expense)}</span><button class="btn sm" data-action="bud-auto">Isi dari rata-rata 3 bulan</button></div></div>
    <div>${EXP_CATS.map(c => { const bg = num(cats[c]), v = st.byCat[c] || 0, r = bg ? v/bg : (v ? 1 : 0);
      const cls = bg && v > bg ? 'bad' : bg && v > .85*bg ? 'warn' : 'good';
      return `<div class="budget-row"><div><b>${esc(c)}</b><div class="small muted">${NEEDS.has(c)?'Kebutuhan':'Keinginan'}</div></div>
        <div class="bwrap stack" style="gap:4px"><div class="bar ${cls}"><i style="width:${Math.min(1,r)*100}%"></i></div><div class="spread small"><span class="num">${rp(v)}</span><span class="${bg && v>bg?'neg':'muted'}">${bg ? (v > bg ? 'lebih ' + rpc(v-bg) : 'sisa ' + rpc(bg-v)) : 'tanpa anggaran'}</span></div></div>
        <input class="in num" data-bind="budget.cats.${esc(c)}" inputmode="numeric" value="${bg ? nf.format(bg) : ''}" placeholder="0" aria-label="Anggaran ${esc(c)}"></div>`; }).join('')}</div>
    ${exTag(S.budget) ? '<p class="small muted">Angka anggaran saat ini adalah contoh.</p>' : ''}
  </section>`;

  // Tujuan
  h += `<section class="panel"><div class="panel-head"><h2>Tujuan tabungan</h2><button class="btn sm primary" data-action="goal-new">＋ Tujuan</button></div>
    ${S.goals.length ? `<div class="tbl-wrap"><table><thead><tr><th>Tujuan</th><th class="r">Target</th><th class="r">Terkumpul</th><th>Progres</th><th class="r">Perlu/bln</th><th>Instrumen yang cocok</th><th></th></tr></thead><tbody>
      ${S.goals.map(g => { const cur = g.accId && g.accId in b ? b[g.accId] : num(g.current); const ml = monthsTo(g.date); const need = Math.max(0, num(g.target) - cur); const per = ml > 0 ? need/ml : need;
        return `<tr><td><b>${esc(g.name)}</b>${exTag(g)}<div class="small muted">${g.date ? monthLabel(g.date.slice(0,7)) : ''} · ${ml} bln lagi</div></td><td class="r num">${rpc(g.target)}</td><td class="r num">${rpc(cur)}</td>
        <td style="min-width:110px"><div class="bar ${cur>=num(g.target)?'good':''}"><i style="width:${Math.min(1, cur/(num(g.target)||1))*100}%"></i></div><div class="small muted">${pct(cur/(num(g.target)||1))}</div></td>
        <td class="r num">${rp(per)}</td><td class="small">${instrumentFor(ml)}</td><td class="r"><button class="btn ghost sm" data-action="goal-edit" data-id="${g.id}">Ubah</button></td></tr>`; }).join('')}
      </tbody></table></div><p class="small muted">Total setoran yang dibutuhkan semua tujuan: <b class="num">${rp(sum(S.goals, g => { const cur = g.accId && g.accId in b ? b[g.accId] : num(g.current); const ml = monthsTo(g.date); return Math.max(0, num(g.target)-cur)/(ml>0?ml:1); }))}</b>/bulan vs rencana ${rp(num(plan.goals))}.</p>`
      : '<div class="empty">Belum ada tujuan. Contoh: dana pendidikan anak, renovasi rumah, umrah, ganti mobil.</div>'}
  </section>`;
  return h;
}
function allocBarPlan(inc, needB, wantB, saveP){
  if (!inc) return '';
  const w = v => clamp(v/inc*100, 0, 100);
  const free = Math.max(0, inc - needB - wantB - saveP);
  return `<div class="alloc"><span style="width:${w(needB)}%;background:var(--c-fi)" title="Kebutuhan"></span><span style="width:${w(wantB)}%;background:var(--c-prop)" title="Keinginan"></span><span style="width:${w(saveP)}%;background:var(--c-eq)" title="Tabungan/investasi"></span><span style="width:${w(free)}%;background:var(--c-cash)" title="Belum dialokasikan"></span></div>
  <div class="legend" style="margin-top:6px"><span><i style="background:var(--c-fi)"></i>Kebutuhan</span><span><i style="background:var(--c-prop)"></i>Keinginan</span><span><i style="background:var(--c-eq)"></i>Tabungan &amp; investasi</span><span><i style="background:var(--c-cash)"></i>Belum dialokasikan</span></div>`;
}
function checkRow(label, amt, accs, hint){
  return `<tr><td><b>${label}</b><div class="small muted">${esc(hint||'')}</div></td><td class="small">${accs.length ? '→ ' + accs.map(a => esc(a.name)).join(', ') : '<span class="muted">belum ada rekening dengan fungsi ini</span>'}</td><td class="r num"><b>${rp(num(amt))}</b></td></tr>`;
}
function monthsTo(d){ if (!d) return 0; const [y,m] = d.split('-').map(Number); const n = new Date(); return Math.max(0, (y - n.getFullYear())*12 + (m - 1 - n.getMonth())); }
function instrumentFor(ml){
  if (ml <= 12) return 'Bank digital (bunga ≤ TBP LPS) / RD pasar uang';
  if (ml <= 36) return 'SBN ritel (ST/SR/ORI), deposito, RD pasar uang';
  if (ml <= 60) return 'SBN ritel, RD pendapatan tetap';
  return 'RD campuran / indeks + SBN';
}

  </section>`;
  h += `<section class="panel"><div class="panel-head"><h2>Utang &amp; cicilan</h2><button class="btn sm" data-action="liab-new">＋ Utang</button></div>
    ${Lb.length ? `<div class="tbl-wrap"><table><thead><tr><th>Nama</th><th>Jenis</th><th class="r">Bunga/th</th><th class="r">Cicilan/bln</th><th class="r">Sisa pokok</th><th></th></tr></thead><tbody>
    ${Lb.map(a => `<tr><td><b>${esc(a.name)}</b>${exTag(a)}</td><td class="small">${esc(a.cls)}</td><td class="r num ${num(a.rate)>=12?'neg':''}">${a.rate ? num(a.rate) + '%' : '–'}</td><td class="r num">${a.payment ? rp(a.payment) : '–'}</td><td class="r num">${rp(a.value)}</td><td class="r"><button class="btn ghost sm" data-action="liab-edit" data-id="${a.id}">Ubah</button></td></tr>`).join('')}</tbody></table></div>
    <p class="note">Total cicilan ${rp(sum(Lb, a => a.payment))}/bln = ${pct(avgIncome() ? sum(Lb, a => a.payment)/avgIncome() : null)} dari pemasukan (batas aman ≤ 30%).</p>`
      : '<p class="muted">Tidak ada utang tercatat.</p>'}

  }
  // Ember jangka pendek–panjang
  const goalsShort = S.goals.filter(g => monthsTo(g.date) <= 36), goalsMid = S.goals.filter(g => monthsTo(g.date) > 36);

      <div class="small muted">Saat sisa waktu &lt; 1 tahun, pindahkan ke pasar uang.</div></div>
    <div class="bucket"><span class="tag">Jangka panjang · sampai usia ${num(p.retireAge||55)}</span><h3>Dana pensiun</h3>
      <div class="small">${R ? `Target ekuitas sekarang <b>${glide(R.yl,R.risk).eq}%</b>, turun ke 25% saat pensiun` : 'Isi profil untuk target alokasi'}</div>
      <ul><li>RD indeks / ETF (LQ45, IDX30, IDX High Dividend) + 10–20% indeks global</li><li>SBN ritel seri SR/ORI sebagai penstabil</li><li>DIRE/REIT atau properti sewa (≤ 10–15%)</li><li>Emas ≤ 5–10% sebagai lindung nilai</li><li>DPLK + JHT/JP BPJS sebagai fondasi</li></ul>
      <div class="small muted">5 tahun terakhir: siapkan 3–5 th biaya hidup di kas/SBN.</div></div>
  </div></section>`;
  // Saran
  const adv = advisories();
  h += `<section class="panel"><div class="panel-head"><h2>Pertimbangan untuk dana &amp; aset Anda</h2><span class="hint">dihitung dari data di aplikasi</span></div><div>${adv.map(advItem).join('') || '<p class="muted">Belum ada catatan.</p>'}</div></section>`;
  h += `<section class="panel" id="ai-panel"><div class="panel-head"><h2>Minta analisis ke Claude</h2><span class="hint">data tetap di perangkat sampai Anda sendiri menempelkannya</span></div>

  return h;
}

const dlg = $('#dlg');
function openForm({title, fields, data = {}, onSave, onDelete, saveLabel = 'Simpan'}){
  const fieldHtml = fields.map(fd => {
    if (fd.hidden && fd.hidden(data)) return '';
    const v = data[fd.k] ?? fd.def ?? '';
    const cls = fd.full ? 'full' : '';
    if (fd.type === 'select') return `<label class="f ${cls}">${fd.l}<select class="in" name="${fd.k}" id="f-${fd.k}">${fd.opts(data).map(o => { const [val,lab] = Array.isArray(o) ? o : [o,o]; return `<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(lab)}</option>`; }).join('')}</select></label>`;
    if (fd.type === 'seg') return `<div class="f ${cls}"><div class="seg" role="group">${fd.opts.map(([val,lab]) => `<button type="button" data-seg="${fd.k}" data-v="${val}" aria-pressed="${v===val}">${lab}</button>`).join('')}</div></div>`;
    if (fd.type === 'money') return `<label class="f ${cls}">${fd.l}<input class="in num" name="${fd.k}" id="f-${fd.k}" inputmode="numeric" value="${v!=='' ? nf.format(num(v)) : ''}" placeholder="0"></label>`;
    return `<label class="f ${cls}">${fd.l}<input class="in" name="${fd.k}" id="f-${fd.k}" type="${fd.type||'text'}" ${fd.type==='number'?'step="any"':''} value="${esc(v)}" ${fd.ph?`placeholder="${esc(fd.ph)}"`:''}></label>`;
  }).join('');
  dlg.innerHTML = `<form class="dlg" method="dialog" id="dform"><div class="dlg-head"><h2>${esc(title)}</h2><button type="button" class="btn ghost" data-close aria-label="Tutup">✕</button></div>
    <div class="dlg-body">${fieldHtml}</div>
    <div class="dlg-foot"><div>${onDelete ? '<button type="button" class="btn danger" id="d-del">Hapus</button>' : ''}</div><div class="row"><button type="button" class="btn" data-close>Batal</button><button type="submit" class="btn primary">${saveLabel}</button></div></div></form>`;
  const form = $('#dform');
  const collect = () => { const o = {...data}; for (const fd of fields){ const el = form.elements[fd.k]; if (el) o[fd.k] = fd.type === 'money' ? num(el.value) : fd.type === 'number' ? num(el.value) : el.value; } return o; };
  form.querySelectorAll('[data-seg]').forEach(btn => btn.onclick = () => { const o = collect(); o[btn.dataset.seg] = btn.dataset.v; openForm({title, fields, data:o, onSave, onDelete, saveLabel}); });
  form.querySelectorAll('input[inputmode="numeric"]').forEach(moneyInput);
  form.querySelectorAll('[data-close]').forEach(b => b.onclick = () => dlg.close());
  form.onsubmit = e => { e.preventDefault(); const err = onSave(collect()); if (err){ toast(err); return; } dlg.close(); };
  if (onDelete){ const del = $('#d-del'); del.onclick = () => { if (del.dataset.armed){ onDelete(); dlg.close(); } else { del.dataset.armed = 1; del.textContent = 'Yakin hapus?'; } }; }
  if (!dlg.open) dlg.showModal();
  const first = form.querySelector('[name="amount"]') || form.querySelector('input,select'); if (first) first.focus();
}
function moneyInput(el){
  el.addEventListener('input', () => { const raw = el.value.replace(/[^\d]/g,''); const pos = el.value.length - el.selectionStart; el.value = raw ? nf.format(+raw) : ''; const np = Math.max(0, el.value.length - pos); try { el.setSelectionRange(np, np); } catch {} });
}

function saveTx(t, old){
  // efek ke aset (setor investasi menambah nilai & modal aset)
  const bump = (tx, sign) => { if (!tx || tx.type !== 'inv') return; const a = S.assets.find(x => x.id === tx.asset); if (!a) return;
    put('assets/' + a.id, {...a, value: num(a.value) + sign*num(tx.amount), cost: num(a.cost) + sign*num(tx.amount)}); };
  if (old){ const k = old.date.slice(0,7); const items = (S.months[k]?.items || []).filter(x => x.id !== old.id); put('months/' + k, {items}); bump(old, -1); }
  if (t){ const k = t.date.slice(0,7); const items = [...(S.months[k]?.items || []).filter(x => x.id !== t.id), t]; put('months/' + k, {items}); bump(t, 1); txMonth = k; }
}

/* ============ Binding input langsung (profil, anggaran) ============ */
function setPath(obj, keys, val){ let o = obj; for (let i = 0; i < keys.length - 1; i++){ o[keys[i]] = (o[keys[i]] && typeof o[keys[i]] === 'object') ? {...o[keys[i]]} : {}; o = o[keys[i]]; } o[keys[keys.length-1]] = val; }
/* Simpan kolom profil/anggaran: otomatis saat mengetik (jeda 0,4 dtk), saat pindah kolom, dan saat app ditutup */
const bindTimers = new Map();
function saveBind(el, quiet){
  clearTimeout(bindTimers.get(el)); bindTimers.delete(el);
  const bind = el.dataset && el.dataset.bind; if (!bind) return false;
  const [root, ...keys] = bind.split('.');
  const numeric = el.inputMode === 'numeric' || el.getAttribute('inputmode') === 'numeric';
  const val = numeric ? num(el.value) : el.value;
  const doc = JSON.parse(JSON.stringify(S[root] || {}));
  let cur = doc; for (const k of keys.slice(0,-1)) cur = cur && cur[k];
  if (cur && cur[keys[keys.length-1]] === val && !doc.example) return false;
  setPath(doc, keys, val);
  delete doc.example;            // data yang Anda ubah bukan lagi contoh
  put('settings/' + root, doc);
  const note = $('#save-note'); if (note) note.textContent = 'Tersimpan ' + new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  return true;
}
function flushBinds(){ for (const el of [...bindTimers.keys()]) saveBind(el, true); }
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'txq'){ txFilter.q = el.value; render(); return; }
  if (el.dataset && el.dataset.bind) saveBind(el);
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.bind) return;
  if (el.getAttribute('inputmode') === 'numeric'){ const raw = el.value.replace(/[^\d]/g,''); if (raw.length > 4 && !/profile\.(birthYear|retireAge|lifeExpectancy|emergencyMonths|stepUp)/.test(el.dataset.bind)) el.value = nf.format(+raw); }
  clearTimeout(bindTimers.get(el)); bindTimers.set(el, setTimeout(() => saveBind(el), 400));
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'txq'){ txFilter.q = e.target.value; render(); } });

  const g = e.target.closest('[data-goto]'); if (g){ setTab(g.dataset.goto); return; }
  const t = e.target.closest('#tabs button'); if (t){ setTab(t.dataset.tab); return; }
  const a = e.target.closest('[data-action]'); if (!a) return;
  const act = a.dataset.action, id = a.dataset.id;
  switch (act){
    case 'tx-new': txForm(); break;
    case 'tx-edit': { const tx = (S.months[a.dataset.m]?.items || []).find(x => x.id === id); if (tx) txForm(tx); break; }
    case 'tx-month': txMonth = addMonths(txMonth, +a.dataset.d); render(); break;
    case 'bud-month': budMonth = addMonths(budMonth, +a.dataset.d); render(); break;
    case 'tx-type': txFilter.type = a.dataset.v; render(); break;
    case 'acc-new': accForm(); break;
    case 'acc-edit': accForm(S.accounts.find(x => x.id === id)); break;
    case 'asset-new': assetForm(null, false); break;
    case 'asset-edit': assetForm(S.assets.find(x => x.id === id)); break;
    case 'liab-new': assetForm(null, true); break;
    case 'liab-edit': assetForm(S.assets.find(x => x.id === id)); break;
    case 'goal-new': goalForm(); break;
    case 'goal-edit': goalForm(S.goals.find(x => x.id === id)); break;
    case 'bud-auto': budAuto(); break;
    case 'export': exportCsv(); break;
    case 'clear-examples': clearExamples(a); break;
    case 'save-profile': { document.querySelectorAll('[data-bind^="profile."]').forEach(el => saveBind(el)); saveNow(); if (document.activeElement) document.activeElement.blur(); toast('Profil tersimpan'); setTimeout(render, 50); break; }
    case 'backup': backup(); break;
    case 'restore': restorePick(); break;
    case 'load-examples': loadExamples(); break;
    case 'wipe': wipe(a); break;
    case 'install': if (deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.finally(() => { deferredPrompt = null; render(); }); } break;
    case 'install-dismiss': lsSet('dp55-install-dismiss','1'); render(); break;
  }
});
function setTab(t){ TAB = t; lsSet('dp55-tab', t); try { history.replaceState(null, '', '#' + t); } catch {} render(); window.scrollTo({top:0}); }
function budAuto(){
  const cm = curMonth(); let keys = monthKeys().filter(k => k < cm).slice(-3); if (!keys.length) keys = [cm];
  const cats = {}; for (const c of EXP_CATS){ const v = sum(keys, k => monthStats(k).byCat[c] || 0) / keys.length; if (v > 0) cats[c] = Math.round(v / 50000) * 50000 || 50000; }
  const doc = JSON.parse(JSON.stringify(S.budget || {})); doc.cats = cats; delete doc.example; put('settings/budget', doc); toast('Anggaran diisi dari rata-rata ' + keys.length + ' bulan');
}
function clearExamples(btn){
  if (!btn.dataset.armed){ btn.dataset.armed = 1; btn.textContent = 'Klik lagi untuk menghapus'; return; }
  for (const c of ['accounts','assets','goals']) S[c].filter(x => x.example).forEach(x => put(c + '/' + x.id, null));
  for (const [k, m] of Object.entries(S.months)){ const items = (m.items||[]).filter(t => !t.example); if (items.length !== (m.items||[]).length) put('months/' + k, items.length ? {items} : null); }
  if (S.budget.example){ const d = {...S.budget}; delete d.example; d.cats = {}; put('settings/budget', d); }
  if (S.profile.example){ put('settings/profile', {retireAge:55, lifeExpectancy:80, emergencyMonths:6, stepUp:5, risk:'Moderat'}); }
  toast('Data contoh dihapus'); setTab('profil');
}
function fileDownload(filename, text, mime){
  const blob = new Blob([text], {type: mime});
  const file = new File([blob], filename, {type: mime});
  // iOS (mode aplikasi) lebih andal lewat lembar Bagikan
  if (/iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[file]})){
    return navigator.share({files:[file], title:filename}).then(() => true).catch(e => e && e.name === 'AbortError' ? false : legacy());
  }
  return Promise.resolve(legacy());
  function legacy(){ const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); return true; }
}
async function exportCsv(){
  const accN = Object.fromEntries(S.accounts.map(a => [a.id, a.name])), asN = Object.fromEntries(S.assets.map(a => [a.id, a.name]));
  const TL = {in:'Pemasukan', out:'Pengeluaran', tr:'Transfer', inv:'Investasi'};
  const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const lines = [['Tanggal','Jenis','Kategori','Jumlah','Dari/Ke rekening','Tujuan','Catatan'].join(',')];
  for (const t of allTx()) lines.push([t.date, TL[t.type], t.cat || '', t.amount, accN[t.acc] || '', t.type === 'tr' ? accN[t.to] : t.type === 'inv' ? asN[t.asset] : '', t.note || ''].map(q).join(','));
  await fileDownload(`transaksi-dompet-pensiun-${todayStr()}.csv`, '\ufeff' + lines.join('\n'), 'text/csv');
}
async function backup(){
  saveNow();
  const ok = await fileDownload(`backup-dompet-pensiun-${todayStr()}.json`, JSON.stringify(snapshot(), null, 1), 'application/json');
  if (ok){ META.lastBackup = Date.now(); saveMeta(); toast('Backup dibuat'); render(); }
}
function restorePick(){ const inp = $('#restore-file'); if (!inp) return; inp.value = ''; inp.onchange = () => { const f = inp.files[0]; if (f) readBackup(f); }; inp.click(); }
function readBackup(f){
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch { toast('File bukan backup yang valid.'); return; }
    if (!d || d.app !== 'dompet-pensiun-55'){ toast('File ini bukan backup Dompet Pensiun 55.'); return; }
    const n = sum(Object.values(d.months||{}), m => (m.items||[]).length);
    const box = $('#restore-confirm');
    box.innerHTML = `<div class="banner warn"><div class="grow">Backup tanggal <b>${esc(new Date(d.savedAt).toLocaleString('id-ID'))}</b>: ${(d.accounts||[]).length} rekening, ${(d.assets||[]).length} aset/utang, ${n} transaksi. Memulihkan akan <b>mengganti semua data</b> di perangkat ini.</div><button class="btn sm danger" id="restore-yes">Ganti dengan backup</button><button class="btn sm" id="restore-no">Batal</button></div>`;
    $('#restore-no').onclick = () => box.innerHTML = '';
    $('#restore-yes').onclick = () => { loadInto(d); saveNow(); toast('Data dipulihkan'); setTab('ringkasan'); };
  };
  r.readAsText(f);
}
function shiftedSeed(seed){
  // geser tanggal contoh agar bulan terakhir = bulan berjalan
  const last = Object.keys(seed.months).sort().pop(); const [ly,lm] = last.split('-').map(Number); const [cy,cm] = curMonth().split('-').map(Number);
  const d = (cy-ly)*12 + (cm-lm), months = {};
  for (const [k,m] of Object.entries(seed.months)){
    const nk = addMonths(k, d);
    months[nk] = {items: m.items.map(t => ({...t, date: nk + '-' + pad(Math.min(28, +t.date.slice(8)))}))};
  }
  return {...seed, months};
}
async function loadExamples(){
  try { const res = await fetch('seed.json'); const seed = await res.json(); loadInto(shiftedSeed(seed)); saveNow(); toast('Data contoh dimuat'); setTab('ringkasan'); }
  catch { toast('Data contoh tidak bisa dimuat (offline?).'); }
}
function wipe(btn){
  if (!btn.dataset.armed){ btn.dataset.armed = 1; btn.textContent = 'Klik lagi: hapus permanen'; return; }
  loadInto({profile:{...DEFAULT_PROFILE}}); saveNow(); toast('Semua data dihapus'); setTab('ringkasan');
}

/* ============ Install & backup banner ============ */
const IS_STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const UA = navigator.userAgent, IS_IOS = /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/.test(UA), IS_MAC = /Macintosh/.test(UA) && !IS_IOS, IS_SAFARI = /Safari/.test(UA) && !/Chrome|Chromium|CriOS|FxiOS|Edg/.test(UA);
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; scheduleRender(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast('Aplikasi terpasang'); scheduleRender(); });
function installSteps(){
  if (IS_IOS) return 'Di Safari: ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas) → <b>Tambah ke Layar Utama</b> → <b>Tambah</b>.';
  if (IS_ANDROID) return 'Di Chrome: menu <b>⋮</b> → <b>Instal aplikasi</b> (atau <b>Tambahkan ke layar utama</b>).';
  if (IS_MAC && IS_SAFARI) return 'Di Safari (macOS Sonoma ke atas): menu <b>File</b> → <b>Tambahkan ke Dock</b>.';
  return 'Di Chrome/Edge: klik ikon <b>Instal</b> di ujung kanan kolom alamat, atau menu <b>⋮</b> → <b>Simpan dan bagikan</b> → <b>Instal halaman sebagai aplikasi</b>.';
}
function installHelp(){
  if (IS_STANDALONE) return '<p class="small pos">Aplikasi sudah terpasang di perangkat ini.</p>';
  return `<p class="small">Pasang di perangkat ini: ${installSteps()}</p>${deferredPrompt ? '<div class="row"><button class="btn primary" data-action="install">Instal sekarang</button></div>' : ''}`;
}
function installBanner(){
  if (IS_STANDALONE || lsGet('dp55-install-dismiss') === '1') return '';
  return `<div class="banner info"><div class="grow"><b>Pasang sebagai aplikasi.</b> ${installSteps()}</div>${deferredPrompt ? '<button class="btn sm primary" data-action="install">Instal</button>' : ''}<button class="btn sm ghost" data-action="install-dismiss">Nanti</button></div>`;
}
function backupBanner(){
  const hasData = S.accounts.some(a => !a.example) || monthKeys().length;
  if (!hasData || hasExamples()) return '';
  const days = META.lastBackup ? (Date.now() - META.lastBackup) / 864e5 : Infinity;
  if (days < 30) return '';
  return `<div class="banner warn"><div class="grow"><b>${META.lastBackup ? 'Sudah ' + Math.floor(days) + ' hari sejak backup terakhir.' : 'Belum ada backup.'}</b> Data hanya ada di perangkat ini; backup melindungi dari HP hilang atau data browser terhapus.</div><button class="btn sm" data-action="backup">Backup sekarang</button></div>`;
}

/* ============ Prompt analisis untuk Claude ============ */
function aiSummary(){
  const b = balances(), R = retirement(), cm = curMonth();
  const months = [addMonths(cm,-3), addMonths(cm,-2), addMonths(cm,-1), cm].map(k => { const s = monthStats(k); return {bulan:k, pemasukan:Math.round(s.income), pengeluaran:Math.round(s.expense), investasi:Math.round(s.inv), perKategori:s.byCat}; });
  return {
    tanggal: todayStr(), usia: age(), usiaPensiun: num(S.profile.retireAge||55), profilRisiko: S.profile.risk || 'Moderat',
    targetBiayaPensiunPerBulanNilaiKini: num(S.profile.retireExpense), pensiunLainPerBulan: num(S.profile.otherPension),
    rataPengeluaranBulanan: Math.round(avgExpense()), rataPemasukanBulanan: Math.round(avgIncome()),
    danaDarurat: Math.round(emergencyFund(b)), targetDanaDaruratBulan: num(S.profile.emergencyMonths||6),
    rekening: S.accounts.map(a => ({nama:a.name, jenis:a.type, fungsi:a.purpose, bungaPersen:num(a.rate), saldo:Math.round(b[a.id])})),
    aset: assetsOnly().map(a => ({nama:a.name, kelas:a.cls, ember:a.bucket, modal:num(a.cost), nilai:num(a.value)})),
    utang: liabs().map(a => ({nama:a.name, jenis:a.cls, bungaPersen:num(a.rate), sisa:num(a.value), cicilan:num(a.payment)})),
    tujuan: S.goals.map(g => ({nama:g.name, target:num(g.target), tanggal:g.date})),
    rencanaSetoranBulanan: S.budget.plan || {},
    proyeksiPensiun: R ? Object.fromEntries(Object.entries(R.res).map(([n,r]) => [n, {proyeksi:Math.round(r.fv), kebutuhan:Math.round(r.need), setoranPerlu:Math.round(r.reqMonthly)}])) : null,
    arusKas4Bulan: months,
    acuan: {tbpLpsBankUmumPersen: TBP_LPS, periodeTbp: TBP_PERIOD, batasJaminanLps: LPS_MAX}
  };
}
function aiPrompt(){
  return `Anda perencana keuangan independen di Indonesia. Analisis data keuangan pribadi berikut (JSON, nilai dalam Rupiah) dan tulis rencana dalam Bahasa Indonesia yang lugas untuk seorang engineer: jawaban tepat, berbasis angka.

Tulis dengan struktur:
## Diagnosis
3–5 poin kondisi saat ini (arus kas, dana darurat, utang, kesiapan pensiun) dengan angka.
## 3 langkah prioritas bulan ini
langkah konkret dengan nominal dan rekening/instrumen tujuan.
## Investasi jangka pendek (≤ 3 tahun)
## Investasi jangka menengah (3–5 tahun)
## Investasi jangka panjang (sampai pensiun)
untuk tiap bagian: instrumen di Indonesia (kelas aset/jenis produk, bukan saham emiten tertentu), persentase alokasi, nominal per bulan, alasan.
## Risiko yang perlu diwaspadai
Aturan: jangan sebut merek produk atau emiten tertentu; patuhi jaminan LPS (bunga ≤ TBP, maks Rp 2 M per bank); jika ada utang berbunga ≥ 12%/th prioritaskan pelunasan; maksimal 450 kata; akhiri dengan satu kalimat bahwa ini bukan nasihat keuangan berlisensi.

DATA:
${JSON.stringify(aiSummary())}`;
}
function wireAI(){
  const btn = $('#ai-copy'), ta = $('#ai-text'), note = $('#ai-note');
  if (!btn) return;
  btn.onclick = async () => {
    const text = aiPrompt();
    try { await navigator.clipboard.writeText(text); note.textContent = 'Tersalin. Buka Claude lalu tempel.'; toast('Prompt tersalin'); }
    catch { ta.hidden = false; ta.value = text; ta.focus(); ta.select(); note.textContent = 'Salin manual teks di bawah.'; }
  };
}
function wireProfil(){}

/* ============ Mulai ============ */
(function start(){
  try { META = JSON.parse(lsGet(META_KEY) || '{}') || {}; } catch { META = {}; }
  let raw = null;
  try { raw = localStorage.getItem(DATA_KEY); localStorage.setItem('dp55-probe','1'); localStorage.removeItem('dp55-probe'); }
  catch { STORAGE_OK = false; }
  if (raw){ try { loadInto(JSON.parse(raw)); } catch { toast('Data rusak; pulihkan dari backup.'); } }
  MODE = 'ready';
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render();
  if (new URLSearchParams(location.search).has('catat')) setTimeout(() => txForm(), 50);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing; if (!w) return;
        w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w); });
      });
    }).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded) return; reloaded = true; saveNow(); location.reload(); });
  }
})();
function showUpdate(worker){
  const t = $('#toast'); t.hidden = false; clearTimeout(toast._t);
  t.innerHTML = 'Versi baru tersedia. <button class="btn sm" id="upd" style="margin-left:8px">Muat ulang</button>';
  $('#upd').onclick = () => worker.postMessage('skipWaiting');
}
